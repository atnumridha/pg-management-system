# H2 In-Memory Database Configuration for Paying Guest Management System (PGMS)
spring.datasource.url=jdbc:h2:file:./pgmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 web console at /h2-console (for dev/debug usage)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Serve SPA fallback regex works across all Spring Boot versions
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Enable gzip compression for frontend assets and API
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
