<div class="card p-4 mb-4" style="max-width: 600px; margin:auto;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Add Invoice</h3>
    <button type="button" (click)="cancelInvoice()" class="btn-close" aria-label="Close"
      style="font-size:1.3rem;"></button>
  </div>
  <form #f="ngForm" (ngSubmit)="f.form.valid && addInvoice()" class="row g-3 form-container" autocomplete="off">
    <div class="form-group col-md-6">
      <label><b>Invoice No</b></label>
      <input type="text" class="form-control" [(ngModel)]="invoice.invoiceNo" name="invoiceNo" required #invoiceNo="ngModel" [ngClass]="{ 'is-invalid': f.submitted && invoiceNo.errors }" readonly />
      <div *ngIf="f.submitted && invoiceNo.errors" class="invalid-feedback">Invoice number is required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Tenant</b></label>
      <select class="form-select" [(ngModel)]="invoice.tenantId" name="tenantId" required #tenantId="ngModel" [ngClass]="{ 'is-invalid': f.submitted && tenantId.errors }">
        <option [ngValue]="0" disabled selected>Select Tenant</option>
        <option *ngFor="let t of tenants" [ngValue]="t.id">{{t.firstName}} {{t.lastName}}</option>
      </select>
      <div *ngIf="f.submitted && tenantId.errors" class="invalid-feedback">Tenant selection required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Allocation</b></label>
      <select class="form-select" [(ngModel)]="invoice.allocationId" name="allocationId" required #allocationId="ngModel" [ngClass]="{ 'is-invalid': f.submitted && allocationId.errors }">
        <option [ngValue]="0" disabled selected>Select Allocation</option>
        <option *ngFor="let alloc of allocationOptions" [ngValue]="alloc.id">{{ alloc.display }}</option>
      </select>
      <div *ngIf="f.submitted && allocationId.errors" class="invalid-feedback">Allocation selection required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Year</b></label>
      <input type="number" class="form-control" [(ngModel)]="invoice.periodYear" name="periodYear" required #periodYear="ngModel" [ngClass]="{ 'is-invalid': f.submitted && periodYear.errors }" />
      <div *ngIf="f.submitted && periodYear.errors" class="invalid-feedback">Year required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Month</b></label>
      <input type="number" class="form-control" [(ngModel)]="invoice.periodMonth" name="periodMonth" required min="1" max="12" #periodMonth="ngModel" [ngClass]="{ 'is-invalid': f.submitted && periodMonth.errors }" />
      <div *ngIf="f.submitted && periodMonth.errors" class="invalid-feedback">Month 1-12 required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Issue Date</b></label>
      <input type="date" class="form-control" [(ngModel)]="invoice.issueDate" name="issueDate" required #issueDate="ngModel" [ngClass]="{ 'is-invalid': f.submitted && issueDate.errors }" />
      <div *ngIf="f.submitted && issueDate.errors" class="invalid-feedback">Issue date required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Due Date</b></label>
      <input type="date" class="form-control" [(ngModel)]="invoice.dueDate" name="dueDate" required #dueDate="ngModel" [ngClass]="{ 'is-invalid': f.submitted && dueDate.errors }" />
      <div *ngIf="f.submitted && dueDate.errors" class="invalid-feedback">Due date required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Subtotal</b></label>
      <input type="number" class="form-control" [(ngModel)]="invoice.subtotal" name="subtotal" required #subtotal="ngModel" [ngClass]="{ 'is-invalid': f.submitted && subtotal.errors }" />
      <div *ngIf="f.submitted && subtotal.errors" class="invalid-feedback">Subtotal required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Utilities</b></label>
      <input type="number" class="form-control" [(ngModel)]="invoice.utilities" name="utilities" required #utilities="ngModel" [ngClass]="{ 'is-invalid': f.submitted && utilities.errors }" />
    </div>
    <div class="form-group col-md-6">
      <label><b>Taxes</b></label>
      <input type="number" class="form-control" [(ngModel)]="invoice.taxes" name="taxes" required #taxes="ngModel" [ngClass]="{ 'is-invalid': f.submitted && taxes.errors }" />
    </div>
    <div class="form-group col-md-6">
      <label><b>Discount</b></label>
      <input type="number" class="form-control" [(ngModel)]="invoice.discount" name="discount" required #discount="ngModel" [ngClass]="{ 'is-invalid': f.submitted && discount.errors }" />
    </div>
    <div class="form-group col-md-6">
      <label><b>Total Due</b> <span class="text-danger">*</span></label>
      <input type="number" class="form-control" [(ngModel)]="invoice.totalDue" name="totalDue" required min="0.01" #totalDue="ngModel" [ngClass]="{ 'is-invalid': f.submitted && totalDue.errors }" />
      <div *ngIf="f.submitted && totalDue.errors" class="invalid-feedback">
        <div *ngIf="totalDue.errors['required']">Total Due required</div>
        <div *ngIf="totalDue.errors['min']">Must be > 0</div>
      </div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Status</b></label>
      <select class="form-select" [(ngModel)]="invoice.status" name="status" required #status="ngModel" [ngClass]="{ 'is-invalid': f.submitted && status.errors }">
        <option value="DUE">Due</option>
        <option value="PENDING">Pending</option>
        <option value="PAID">Paid</option>
        <option value="OVERDUE">Overdue</option>
        <option value="PARTIALLY_PAID">Partially Paid</option>
      </select>
    </div>
    <div class="form-group col-md-12 d-flex justify-content-center gap-2">
      <button class="btn btn-success" type="submit">Add Invoice</button>
      <button type="button" (click)="cancelInvoice()" class="btn btn-secondary">Cancel</button>
    </div>
  </form>
</div>
