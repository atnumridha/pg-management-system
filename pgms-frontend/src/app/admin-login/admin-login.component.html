<section class="vh-100">
  <div class="container-fluid h-custom">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-md-9 col-lg-6 col-xl-5">
        <img src="../assets/noBgLogin.png"
          class="img-fluid" alt="Sample image">
      </div>
      <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
        <form (ngSubmit)="login()">
          <div class="divider d-flex align-items-center my-4">
            <p class="text-center fw-bold mx-3 mb-0">Login</p>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <!-- Username input -->
          <div class="form-outline mb-4">
            <input type="text" id="adminName" class="form-control form-control-lg"
              placeholder="Enter admin username" [(ngModel)]="username" name="username" required autocomplete="username"/>
            <label class="form-label" for="adminName">&nbsp;Username</label>
          </div>

          <!-- Password input -->
          <div class="form-outline mb-3">
            <input type="password" id="adminPassword" class="form-control form-control-lg"
              placeholder="Enter password" [(ngModel)]="password" name="password" required autocomplete="current-password"/>
            <label class="form-label" for="adminPassword">&nbsp;Password</label>
          </div>

          <div class="text-center text-lg-start mt-4 pt-2">
            <button type="submit" class="btn btn-dark btn-lg"
              style="padding-left: 2.5rem; padding-right: 2.5rem;" [disabled]="loading">
              {{ loading ? 'Logging in...' : 'Login' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
