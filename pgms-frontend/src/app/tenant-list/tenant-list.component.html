<div class="container my-4">
<h1 class="section-header">
  <span class="icon" aria-hidden="true">👥</span>
  Tenants Management
</h1>
<hr>
  <div class="row mb-2">
    <div class="col-8 mb-2">
      <input class="form-control" [(ngModel)]="searchTerm" placeholder="Search tenants...">
    </div>
    <div class="col-4 mb-2 text-end">
      <button class="btn btn-primary" (click)="openAddTenantDialog()" aria-label="Add Tenant">
        <fa-icon [icon]="faPlus"></fa-icon>
      </button>
    </div>
  </div>

  <table class="table table-bordered" *ngIf="filteredTenants().length > 0">
    <thead class="table-dark">
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>KYC Type</th>
        <th>KYC ID</th>
        <th>Status</th>
        <th>
          <fa-icon [icon]="faBars" aria-label="Actions"></fa-icon>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tenant of filteredTenants()">
        <ng-container *ngIf="editId !== tenant.id; else editRow">
          <td>{{ tenant.firstName }}</td>
          <td>{{ tenant.lastName }}</td>
          <td>{{ tenant.phone }}</td>
          <td>{{ tenant.email }}</td>
          <td>{{ tenant.kycType }}</td>
          <td>{{ tenant.kycId }}</td>
          <td>
            <span [class]="tenant.status === 'ACTIVE' ? 'badge bg-success' : 'badge bg-secondary'">{{ tenant.status }}</span>
          </td>
          <td>
            <div class="d-flex justify-content-end">
              <button class="btn btn-sm btn-info me-2" (click)="beginEdit(tenant)" aria-label="Edit Tenant">
                <fa-icon [icon]="faEdit"></fa-icon>
              </button>
              <button class="btn btn-sm btn-danger" (click)="deleteTenant(tenant.id)" aria-label="Delete Tenant">
                <fa-icon [icon]="faTrash"></fa-icon>
              </button>
            </div>
          </td>
        </ng-container>
        <ng-template #editRow>
          <td><input class="form-control" [(ngModel)]="editModel.firstName"></td>
          <td><input class="form-control" [(ngModel)]="editModel.lastName"></td>
          <td><input class="form-control" [(ngModel)]="editModel.phone"></td>
          <td><input class="form-control" [(ngModel)]="editModel.email"></td>
          <td><input class="form-control" [(ngModel)]="editModel.kycType"></td>
          <td><input class="form-control" [(ngModel)]="editModel.kycId"></td>
          <td>
            <select class="form-select" [(ngModel)]="editModel.status">
              <option value="ACTIVE">Active</option>
              <option value="VACATED">Vacated</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </td>
          <td>
            <div class="d-flex justify-content-end">
              <button class="btn btn-success btn-sm me-2" (click)="saveEdit()" aria-label="Save">
                <fa-icon [icon]="faSave"></fa-icon>
              </button>
              <button class="btn btn-secondary btn-sm" (click)="cancelEdit()" aria-label="Cancel">
                <fa-icon [icon]="faTimes"></fa-icon>
              </button>
            </div>
          </td>
        </ng-template>
      </tr>
    </tbody>
  </table>
  <div *ngIf="tenants.length === 0 && !loading && !error">
    <div class="alert alert-info mt-3">No tenants found.</div>
  </div>
