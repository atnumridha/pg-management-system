<div class="card p-4 mb-4" style="max-width: 500px; margin:auto;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Add Payment</h3>
    <button type="button" (click)="cancelPayment()" class="btn-close" aria-label="Close"
      style="font-size:1.3rem;"></button>
  </div>
  <form #f="ngForm" (ngSubmit)="f.form.valid && addPayment()" class="row g-3 form-container" autocomplete="off">
    <div class="form-group col-md-6">
      <label><b>Invoice</b></label>
      <select class="form-select" [(ngModel)]="payment.invoiceId" name="invoiceId" required #invoiceId="ngModel" [ngClass]="{ 'is-invalid': f.submitted && invoiceId.errors }">
        <option [ngValue]="0" disabled selected>Select Invoice</option>
        <option *ngFor="let inv of invoices" [ngValue]="inv.id">{{ inv.invoiceNo }}</option>
      </select>
      <div *ngIf="f.submitted && invoiceId.errors" class="invalid-feedback">Invoice selection required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Amount</b></label>
      <input type="number" class="form-control" [(ngModel)]="payment.amount" name="amount" required #amount="ngModel" [ngClass]="{ 'is-invalid': f.submitted && amount.errors }" />
      <div *ngIf="f.submitted && amount.errors" class="invalid-feedback">Amount required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Method</b></label>
      <select class="form-select" [(ngModel)]="payment.method" name="method" required #method="ngModel" [ngClass]="{ 'is-invalid': f.submitted && method.errors }">
        <option value="" disabled selected>Select Method</option>
        <option *ngFor="let m of methods" [value]="m">{{ m }}</option>
      </select>
      <div *ngIf="f.submitted && method.errors" class="invalid-feedback">Method required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Paid At</b></label>
      <input type="date" class="form-control" [(ngModel)]="payment.paidAt" name="paidAt" required #paidAt="ngModel" [ngClass]="{ 'is-invalid': f.submitted && paidAt.errors }" />
      <div *ngIf="f.submitted && paidAt.errors" class="invalid-feedback">Date required</div>
    </div>
    <div class="form-group col-md-6">
      <label><b>Status</b></label>
      <select class="form-select" [(ngModel)]="payment.status" name="status" required #status="ngModel" [ngClass]="{ 'is-invalid': f.submitted && status.errors }">
        <option value="COMPLETED">Completed</option>
        <option value="PENDING">Pending</option>
        <option value="FAILED">Failed</option>
      </select>
    </div>
    <div class="form-group col-md-6">
      <label><b>Reference</b> <span class="text-muted">(Optional)</span></label>
      <input type="text" class="form-control" [(ngModel)]="payment.reference" name="reference" />
    </div>
    <div class="form-group col-md-12">
      <label><b>Notes</b> <span class="text-muted">(Optional)</span></label>
      <textarea class="form-control" [(ngModel)]="payment.notes" name="notes"></textarea>
    </div>
    <div class="form-group col-md-12 d-flex justify-content-center gap-2">
      <button class="btn btn-success" type="submit">Add Payment</button>
      <button type="button" (click)="cancelPayment()" class="btn btn-secondary">Cancel</button>
    </div>
  </form>
</div>
